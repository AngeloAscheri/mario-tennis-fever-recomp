name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content-guard:
    # No game content, keys or generated game code in the repository (tools/check_content.py).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/check_content.py

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync
      - run: uv run ruff check
      - name: The generator's modules import
        run: uv run python -c "import sys; sys.path.insert(0, 'recomp'); import gen, versions, layout, patches"
      - name: Tests (content guard, versions, lifter against Unicorn)
        run: uv run pytest -q
      - name: Lifter differential test, more cases
        run: uv run tools/cpu/lift_diff.py --n 2000
