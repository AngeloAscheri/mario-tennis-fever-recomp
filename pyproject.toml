[project]
name = "mtf-recomp"
version = "0.0.0"
description = "Static recompilation of Mario Tennis Fever (Switch 2): generator and analysis tools"
requires-python = ">=3.12"
dependencies = ["lz4>=4.4", "numpy>=2.3"]

[dependency-groups]
dev = ["ruff>=0.14", "pytest>=8.4", "capstone>=5.0.9", "unicorn>=2.1"]

[tool.ruff]
line-length = 120
# vendored from mkw-recomp / totk-pc-recomp / LAS Recomp: kept close to upstream so the two can be compared
extend-exclude = ["recomp"]

[tool.ruff.lint]
select = ["E9", "F"]

[tool.uv]
package = false
